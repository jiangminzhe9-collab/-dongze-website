<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>塔羅命運研究所｜東澤文創</title><style>body{margin:0;background:radial-gradient(circle at top,#33294d,#0d1020 70%);color:#f7efd9;font-family:system-ui,'Noto Sans TC',sans-serif;min-height:100vh}main{max-width:850px;margin:auto;padding:50px 20px;text-align:center}a{color:#d9c493}h1{font-size:clamp(32px,6vw,56px);margin:15px 0}.sub{color:#c8bdd6;line-height:1.8}button{border:1px solid #d4b975;background:#d4b975;color:#18162b;padding:14px 24px;border-radius:30px;font-size:17px;font-weight:700;cursor:pointer;margin:8px}button.secondary{background:transparent;color:#ead9ae}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin:36px 0}.card{width:190px;min-height:270px;border:1px solid #ae925f;border-radius:15px;background:linear-gradient(155deg,#3a3159,#171c35);padding:18px;box-sizing:border-box;box-shadow:0 15px 30px #0005;display:flex;flex-direction:column;justify-content:center;align-items:center}.symbol{font-size:60px;color:#e2c57e}.name{font-size:25px;font-weight:700;margin:15px 0}.desc{line-height:1.7;color:#e3d8e6}.orientation{color:#e2c57e;font-size:13px}footer{font-size:13px;color:#aaa1b5;line-height:1.8;margin-top:45px}</style></head><body><main><p><a href="/">← 返回東澤文創</a></p><p>✦ DONGZE ORIGINAL EXPERIENCE ✦</p><h1>塔羅命運研究所</h1><p class="sub">在星光之間，找到一個重新思考的角度。<br>選擇一張每日啟示，或探索三張牌的故事。</p><button id="daily">每日一張</button><button id="three" class="secondary">三張牌占卜</button><section id="cards" class="cards" aria-live="polite"><div class="card"><div class="symbol">✧</div><div class="name">準備抽牌</div><div class="desc">今天，你想探索什麼？</div></div></section><p id="hint" class="sub"></p><footer>本服務僅供娛樂及自我探索，不構成投資、醫療或其他專業建議。<br>© DONGZE CULTURE & CREATIVITY</footer></main><script>const cards=[["愚者","新的開始","保持好奇，踏出小小一步"],["魔術師","行動與創造","善用眼前資源"],["女祭司","直覺與沉澱","聆聽內心"],["皇后","滋養與成長","照顧重要的人事物"],["皇帝","秩序與責任","建立可行的計畫"],["教皇","學習與傳承","向可靠的經驗請教"],["戀人","選擇與連結","確認真正重視的價值"],["戰車","意志與前進","專注眼前方向"],["力量","溫柔的勇氣","耐心勝過蠻力"],["隱者","獨處與探索","留時間思考"],["命運之輪","變化與循環","保持彈性"],["正義","公平與衡量","查證資訊再決定"],["倒吊人","換個角度","暫時放慢腳步"],["死神","結束與轉化","為新階段騰出空間"],["節制","平衡與調和","調整生活節奏"],["惡魔","執著與限制","辨識不必要的束縛"],["高塔","突變與覺察","重新檢視基礎"],["星星","希望與療癒","持續微小進步"],["月亮","迷惘與想像","先釐清不確定性"],["太陽","活力與清晰","分享你的熱情"],["審判","回顧與更新","從經驗中學習"],["世界","完成與整合","肯定自己的努力"]];const root=document.getElementById('cards'),hint=document.getElementById('hint');function draw(n){const ids=Array.from({length:cards.length},(_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const labels=n===3?['過去','現在','未來']:['今日啟示'];root.replaceChildren();ids.slice(0,n).forEach((id,i)=>{const [name,meaning,advice]=cards[id],reversed=Math.random()<.5;const el=document.createElement('article');el.className='card';const o=document.createElement('div');o.className='orientation';o.textContent=labels[i]+' · '+(reversed?'逆位':'正位');const s=document.createElement('div');s.className='symbol';s.textContent=['☾','✦','✧','☼','◇'][id%5];const h=document.createElement('div');h.className='name';h.textContent=name;const p=document.createElement('div');p.className='desc';p.textContent=(reversed?'重新檢視：':'牌義：')+meaning+'。'+advice;el.append(o,s,h,p);root.append(el)});hint.textContent=n===3?'把三張牌當作反思過去、現在與未來可能性的提示。':'這是一則供你思考的今日提醒。'}document.getElementById('daily').onclick=()=>draw(1);document.getElementById('three').onclick=()=>draw(3);</script></body></html>
